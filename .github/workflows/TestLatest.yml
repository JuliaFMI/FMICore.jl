name: Test v1 (latest)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/TestLatest.yml'

permissions:
  actions: write # lets julia-actions/cache delete outdated caches
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # keep the other jobs running if one fails
      matrix:
        julia-version: ['1']
        julia-arch: [x64, x86, aarch64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        experimental: [false]
        exclude:
          - os: ubuntu-latest
            julia-arch: aarch64
          - os: windows-latest
            julia-arch: aarch64
          - os: macOS-latest
            julia-arch: x64
          - os: macOS-latest
            julia-arch: x86

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }} # '1' is the latest stable 1.x release
          arch: ${{ matrix.julia-arch }}

      - name: "Set up julia-cache" # caches packages, artifacts and precompiled files
        uses: julia-actions/cache@v3

      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1

      - name: "Run tests"
        uses: julia-actions/julia-runtest@v1

      - name: "Preprocess coverage"
        uses: julia-actions/julia-processcoverage@v1

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
